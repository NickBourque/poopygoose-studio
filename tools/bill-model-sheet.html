<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bill model sheet</title>
<!-- Dev page: Bill the duck's model sheet, put together by source/bill/rig.js from his traced master: each
     pose whole (wings crossed, wings at his sides) with every face, then the faces close up. -->
<style>
  body { font: 14px/1.4 system-ui; margin: 16px; background: #F6F1E7; color: #482319; }
  h2 { font-size: 16px; margin: 14px 0 6px; }
  .grid { display: grid; grid-template-columns: repeat(4, max-content); gap: 10px 14px; margin-bottom: 18px; }
  figure { margin: 0; text-align: center; }
  img { display: block; background: #FFFDF8; border-radius: 14px; }
</style>
</head>
<body>
<h2>Wings crossed (standing about)</h2><div class="grid" id="crossed"></div>
<h2>Wings at his sides (on the move)</h2><div class="grid" id="free"></div>
<h2>Faces</h2><div class="grid" id="faces"></div>
<script type="module">
  import { loadBillRig, VIEWBOX, FACES } from '../source/bill/rig.js';
  const rig = await loadBillRig(new URL('../source/bill/', location.href));
  const NAMES = { grumpy: 'grumpy', blink: 'blink', stare: 'The Stare', roll: 'eye-roll (Bread Toss)' };
  const doc = (markup, { x, y, w, h }) => `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${x} ${y} ${w} ${h}" width="${w}" height="${h}">${markup}</svg>`;
  const add = (where, svg, label, width) => {
    const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); img.width = width;
    const fig = document.createElement('figure'); fig.append(img, Object.assign(document.createElement('figcaption'), { textContent: label }));
    document.getElementById(where).append(fig);
  };
  const HEAD_BOX = { x: 220, y: 60, w: 420, h: 360 };
  for (const pose of ['crossed', 'free']) for (const face of FACES) add(pose, doc(rig.figure(pose, face), VIEWBOX), NAMES[face], 200);
  for (const face of FACES) add('faces', doc(rig.figure('crossed', face), HEAD_BOX), NAMES[face], 230);
  window.result = 'ok';
</script>
</body>
</html>
